# RAG Backend Config
# 将API与模型配置从代码迁移到此文件。

rag:
  # 用于RAG模式生成的模型与API设置
  model: "openai/gpt-4o-mini"
  base_url: "https://openrouter.ai/api/v1/"
  # 支持从环境变量读取，格式: ENV:VAR_NAME
  api_key: "sk-xxx"  # 替换为实际的API密钥或使用环境变量

no_retrieval:
  # 用于无检索对话的模型与API设置
  model: "openai/gpt-4o-mini"
  base_url: "https://openrouter.ai/api/v1/"
  api_key: "sk-xxxx"
